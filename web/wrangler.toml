name = "salahalarm-android"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Only these paths go to this Worker; the rest of salahalarm.com (SEO site on
# Pages, /go/* tracking links) is untouched.
routes = [
  { pattern = "salahalarm.com/get*", zone_name = "salahalarm.com" },
  { pattern = "salahalarm.com/android*", zone_name = "salahalarm.com" },
  { pattern = "salahalarm.com/start*", zone_name = "salahalarm.com" },
  { pattern = "salahalarm.com/api/*", zone_name = "salahalarm.com" },
  { pattern = "salahalarm.com/download/*", zone_name = "salahalarm.com" },
  { pattern = "salahalarm.com/assets/*", zone_name = "salahalarm.com" },
  { pattern = "salahalarm.com/.well-known/apple-app-site-association", zone_name = "salahalarm.com" },
]

# Email sync to PostHog (src/emailsync.js): recent sign-ins every 15 minutes,
# everyone on Sundays. The second entry must match FULL_SYNC_CRON.
[triggers]
crons = ["*/15 * * * *", "17 3 * * 0"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/download/*"]

# APK + latest.json, uploaded by .github/workflows/android.yml
# Purchases are reported to the affiliate Worker server-to-server (src/postpay.js).
[[services]]
binding = "AFFILIATES"
service = "salahalarm-affiliates"

[[r2_buckets]]
binding = "APKS"
bucket_name = "salahalarm-apks"

