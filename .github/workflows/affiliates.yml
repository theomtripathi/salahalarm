name: Affiliates deploy

# Deploys affiliates/ (affiliate.salahalarm.com: the Salah Alarm Affiliates portal,
# tracking endpoints and admin dashboard) to Cloudflare. Data lives in a SQLite
# Durable Object, created by the deploy itself.

on:
  push:
    branches: [claude/project-thread-0m1sd5]
    paths:
      - "affiliates/**"
      - ".github/workflows/affiliates.yml"
  workflow_dispatch:

concurrency:
  group: affiliates-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: affiliates
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

      - name: Deploy
        run: npx wrangler deploy

      - name: Check
        working-directory: .
        run: |
          sleep 20
          for p in /healthz / /content /content/makkah-trip-story /faq /terms /resources /login /admin/login /styles.css; do
            echo "$p $(curl -s -o /dev/null -w '%{http_code}' https://affiliate.salahalarm.com$p)"
          done
