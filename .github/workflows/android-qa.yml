name: Android QA (emulator)

# Builds the release APK, boots an Android 14 emulator, and runs scripts/qa.py:
# sign in with a fresh email account, check the no-plan lock screen, start the
# free trial, walk setup and every tab, and fail on any crash. Screenshots and
# logcat are uploaded as the "qa" artifact.

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-7o1a8e]
    paths:
      - "android/scripts/qa.py"
      - ".github/workflows/android-qa.yml"

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          VERSION_CODE: "99"
          VERSION_NAME: "qa"
        run: ./gradlew --no-daemon :app:assembleRelease

      # A throwaway email account for this run (Firebase Auth REST, public web key).
      - name: Test account
        run: |
          key=$(grep -oP 'FIREBASE_API_KEY = "\K[^"]+' ../web/wrangler.toml)
          email="qa-${GITHUB_RUN_ID}@salahalarm-qa.test"
          password="Qa-$(openssl rand -hex 8)"
          token=$(curl -sS "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$key" \
            -H "content-type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"returnSecureToken\":true}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(!r.idToken){console.error(s);process.exit(1)}process.stdout.write(r.idToken)})')
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          { echo "QA_EMAIL=$email"; echo "QA_PASSWORD=$password"; echo "QA_TOKEN=$token"; } >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: python3 scripts/qa.py app/build/outputs/apk/release/app-release.apk "$QA_EMAIL" "$QA_PASSWORD" "$QA_TOKEN"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa
          path: android/qa-out/

      # Small JPEG copies committed under android/qa-results/<run>/ on this branch, so
      # reviewers without artifact access can open them. GITHUB_TOKEN pushes do not
      # trigger other workflows.
      - name: Publish screenshots
        if: always()
        working-directory: .
        run: |
          out="android/qa-results/$GITHUB_RUN_ID"; mkdir -p "$out"
          python3 -m pip install --quiet --user --break-system-packages pillow
          python3 -c 'import sys, pathlib; from PIL import Image
          for f in sorted(pathlib.Path("android/qa-out").glob("*.png")):
              im = Image.open(f).convert("RGB"); im.thumbnail((420, 2000)); im.save(pathlib.Path(sys.argv[1]) / (f.stem + ".jpg"), quality=70)' "$out"
          cp android/qa-out/summary.json "$out/" 2>/dev/null || true
          grep -E "FATAL|AndroidRuntime|salahalarm" android/qa-out/logcat.txt 2>/dev/null | tail -300 > "$out/logcat-app.txt" || true
          git add "$out"
          git -c user.name=qa-bot -c user.email=qa-bot@users.noreply.github.com commit --quiet -m "QA screenshots for run $GITHUB_RUN_ID"
          for i in 1 2 3; do git pull --quiet --rebase origin "$GITHUB_REF_NAME" && git push --quiet origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
