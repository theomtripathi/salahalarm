name: Android funnel deploy

# Deploys web/ (salahalarm.com/get, /android, /api, /download) to Cloudflare.
# Worker secrets (FIREBASE_SERVICE_ACCOUNT, DODO_PAYMENTS_API_KEY, DODO_WEBHOOK_SECRET)
# live on the Worker and survive deploys.

on:
  push:
    branches: [main, claude/project-thread-7o1a8e]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
    inputs:
      dodo_setup:
        description: "Also create the live Dodo products and webhook (once)"
        type: boolean
        default: false
      dodo_products:
        description: "Create a fresh set of live Dodo products at the prices in web/src/pricing.js"
        type: boolean
        default: false
      dodo_local_products:
        description: "Create live Dodo products in local currency (LOCAL in web/src/pricing.js)"
        type: boolean
        default: false
      price_table:
        description: "Print what each country is charged (Dodo checkout preview)"
        type: boolean
        default: false
      homepage_ref:
        description: "Also deploy the salahalarm.com homepage (website/) from this branch or commit"
        type: string
        default: ""

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

      - name: APK bucket
        run: npx wrangler r2 bucket create salahalarm-apks || echo "bucket already exists"

      - name: Deploy
        run: npx wrangler deploy

      # The Dodo key only exists as a Worker secret, so the Worker creates the
      # products itself; this step stores the webhook secret it hands back.
      - name: Dodo products and webhook
        if: ${{ inputs.dodo_setup }}
        run: |
          sleep 10
          curl -sS -X POST https://salahalarm.com/api/admin/dodo-setup \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            -d '{"environment":"live_mode"}' -o "$RUNNER_TEMP/dodo.json" -w "HTTP %{http_code}\n"
          node -e '
            const r = require(process.argv[1]);
            if (r.webhook?.secret) console.log("::add-mask::" + r.webhook.secret);
            for (const line of r.log || []) console.log(line);
            if (r.error) { console.log("::error::" + r.error + " " + JSON.stringify(r.detail)); process.exit(1); }
            console.log("PRODUCTS = \x27" + JSON.stringify(r.products) + "\x27");
            console.log("webhook " + (r.webhook?.id || "none") + (r.webhook?.secret ? " (secret stored)" : " (no secret returned)"));
          ' "$RUNNER_TEMP/dodo.json"
          secret=$(node -e 'process.stdout.write(require(process.argv[1]).webhook?.secret || "")' "$RUNNER_TEMP/dodo.json")
          if [ -n "$secret" ]; then printf %s "$secret" | npx wrangler secret put DODO_WEBHOOK_SECRET; fi
          rm -f "$RUNNER_TEMP/dodo.json"

      - name: New Dodo products
        if: ${{ inputs.dodo_products || inputs.dodo_local_products }}
        env:
          SCOPE: ${{ inputs.dodo_local_products && 'local' || 'tiers' }}
        run: |
          sleep 10
          curl -sS -X POST https://salahalarm.com/api/admin/dodo-products \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            -d "{\"scope\":\"$SCOPE\"}" -o "$RUNNER_TEMP/products.json" -w "HTTP %{http_code}\n"
          node -e '
            const r = require(process.argv[1]);
            for (const line of r.log || []) console.log(line);
            if (r.error) { console.log("::error::" + r.error + " " + JSON.stringify(r.detail)); process.exit(1); }
            console.log("PRODUCTS = \x27" + JSON.stringify(r.products) + "\x27");
          ' "$RUNNER_TEMP/products.json"

      - name: Price table
        if: ${{ inputs.price_table }}
        run: |
          sleep 5
          curl -sS "https://salahalarm.com/api/admin/prices?countries=US,GB,AE,SA,QA,KW,OM,BH,TR,MY,IN,PK,ID,BD,EG,NG,MA" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "$RUNNER_TEMP/prices.json" -w "HTTP %{http_code}\n"
          node -e '
            const { rows = [], error } = require(process.argv[1]);
            if (error) { console.log("::error::" + error); process.exit(1); }
            const f = (p) => p ? `${p.currency} ${p.amount}` : "-";
            for (const r of rows) {
              const by = Object.fromEntries(r.plans.map((p) => [p.plan, p]));
              console.log(`${r.country} ${r.tier} | weekly ${f(by.weekly)} | yearly ${f(by.yearly)} | offer ${f(r.offer)}`);
            }
          ' "$RUNNER_TEMP/prices.json"

      - name: Check
        run: |
          for p in /get/ /android/ /api/config; do
            echo "$p $(curl -s -o /dev/null -w '%{http_code}' https://salahalarm.com$p)"
          done

  homepage:
    if: ${{ inputs.homepage_ref != '' }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.homepage_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test
      - run: npm run build
      - run: npx --yes wrangler@4.152.0 deploy

      - name: Check
        run: |
          for p in / /blog/en/ /get/ /android/ /go/ig1; do
            echo "$p $(curl -s -o /dev/null -w '%{http_code}' https://salahalarm.com$p)"
          done
