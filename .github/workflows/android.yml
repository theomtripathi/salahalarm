name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build to salahalarm.com/download (needs the Cloudflare secrets)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Check translations
        run: node scripts/build-i18n.mjs --check

      - name: Version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # Release builds are signed with the SalahAlarm key so every update installs
      # over the previous one. Without the secrets the APK is debug-signed (CI check only).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key loaded"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building a debug-signed APK"
          fi

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SalahAlarm-$VERSION_NAME.apk"
          printf '{"versionCode":%s,"versionName":"%s","sha":"%s","builtAt":"%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/latest.json
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SalahAlarm-${{ env.VERSION_NAME }}
          path: android/dist/

      - name: Publish to salahalarm.com
        if: ${{ inputs.publish }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIGNED: ${{ env.SIGNING_STORE_FILE }}
        run: |
          if [ -z "$SIGNED" ]; then echo "::error::Refusing to publish a debug-signed APK"; exit 1; fi
          npx --yes wrangler@4.152.0 r2 object put salahalarm-apks/salahalarm-latest.apk --remote \
            --file "dist/SalahAlarm-$VERSION_NAME.apk" --content-type application/vnd.android.package-archive
          npx --yes wrangler@4.152.0 r2 object put salahalarm-apks/latest.json --remote \
            --file dist/latest.json --content-type application/json
